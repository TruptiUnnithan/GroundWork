<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Groundwork</title>
<meta name="description" content="A 90-day ramp-up app for new PMs: lay one brick a day, run every task through the playbook, and keep your glossary, people, wins and Friday reviews in one place.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Hanken+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: an app on blueprint paper. Dark ink rail on the left, working surface on a faint survey grid.
   The 90 days are a foundation of bricks, laid bottom-up; flagging pink marks today and the next action. */
:root {
  --paper: #f3f5fa;
  --gridline: rgba(47, 84, 190, 0.06);
  --surface: #ffffff;
  --ink: #111a2e;
  --muted: #5b6478;
  --rule: #dde2ec;
  --rail: #111a2e;
  --rail-ink: #e9edf6;
  --rail-muted: #8d97ad;
  --flag: #e0306f;
  --flag-ink: #ffffff;
  --flag-soft: #fde7ef;
  --done: #1f9d6b;
  --done-soft: #e2f5ec;
  --phase-1: #c9d6f7;
  --phase-2: #9db5f0;
  --phase-3: #6f8fe4;
  --phase-4: #4766c9;
  --brick-open: #e6eaf3;
  --font-display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r: 12px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0c1222; --gridline: rgba(120, 150, 240, 0.05); --surface: #151d31; --ink: #e8ecf5; --muted: #95a0b8; --rule: #253049;
    --rail: #070b16; --rail-ink: #e8ecf5; --rail-muted: #7d88a1;
    --flag: #ff4f8b; --flag-ink: #1a0610; --flag-soft: #3b1426; --done: #3ccf93; --done-soft: #12301f;
    --phase-1: #22305a; --phase-2: #2e4383; --phase-3: #3f5db0; --phase-4: #5a7ce0; --brick-open: #1b2540;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0c1222; --gridline: rgba(120, 150, 240, 0.05); --surface: #151d31; --ink: #e8ecf5; --muted: #95a0b8; --rule: #253049;
  --rail: #070b16; --rail-ink: #e8ecf5; --rail-muted: #7d88a1;
  --flag: #ff4f8b; --flag-ink: #1a0610; --flag-soft: #3b1426; --done: #3ccf93; --done-soft: #12301f;
  --phase-1: #22305a; --phase-2: #2e4383; --phase-3: #3f5db0; --phase-4: #5a7ce0; --brick-open: #1b2540;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background-color: var(--paper);
  background-image: linear-gradient(var(--gridline) 1px, transparent 1px), linear-gradient(90deg, var(--gridline) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button, input, textarea, select { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--flag); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; line-height: 1.05; text-wrap: balance; }
p { margin: 0; }
.mono { font-family: var(--font-mono); font-size: 12px; }
.label { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }

/* Shell */
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; }
.rail { background: var(--rail); color: var(--rail-ink); position: sticky; top: 0; height: 100vh; padding: 22px 14px; display: flex; flex-direction: column; gap: 22px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; font-family: var(--font-display); font-weight: 900; font-stretch: 125%; font-size: 19px; color: var(--rail-ink); text-decoration: none; }
.brand-day { margin: 0 8px; padding: 12px; border-radius: 10px; background: color-mix(in srgb, var(--rail-ink) 7%, transparent); display: grid; gap: 4px; }
.brand-day b { font-family: var(--font-display); font-weight: 800; font-stretch: 112%; font-size: 22px; }
.brand-day .mini { height: 4px; border-radius: 2px; background: color-mix(in srgb, var(--rail-ink) 14%, transparent); overflow: hidden; }
.brand-day .mini i { display: block; height: 100%; background: var(--flag); }
.brand-day span { color: var(--rail-muted); font-size: 12px; }
.nav { display: grid; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; color: var(--rail-muted); text-decoration: none; font-weight: 500; transition: background 0.15s, color 0.15s; }
.nav a:hover { color: var(--rail-ink); background: color-mix(in srgb, var(--rail-ink) 6%, transparent); }
.nav a[aria-current="page"] { color: var(--rail-ink); background: color-mix(in srgb, var(--rail-ink) 11%, transparent); }
.nav a[aria-current="page"] svg { color: var(--flag); }
.nav svg { width: 18px; height: 18px; flex: none; }
.nav .count { margin-left: auto; font-family: var(--font-mono); font-size: 11px; color: var(--rail-muted); }
.rail-foot { margin-top: auto; display: grid; gap: 8px; padding: 0 8px; }
.rail-foot label { color: var(--rail-muted); font-size: 12px; display: grid; gap: 4px; }
.rail-foot input { background: transparent; border: 1px solid color-mix(in srgb, var(--rail-ink) 18%, transparent); color: var(--rail-ink); border-radius: 6px; padding: 6px 8px; font-family: var(--font-mono); font-size: 12px; color-scheme: dark; }

.main { padding: 32px clamp(16px, 4vw, 48px) 80px; min-width: 0; }
.view { max-width: 68rem; margin: 0 auto; display: grid; gap: 22px; animation: in 0.35s cubic-bezier(.2,.8,.2,1); }
main[data-still] .view { animation: none; }
@keyframes in { from { opacity: 0.3; transform: translateY(8px); } }
.view-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; }
.view-head h1 { font-size: clamp(30px, 4.5vw, 46px); font-weight: 900; font-stretch: 118%; letter-spacing: -0.02em; }
.view-head p { color: var(--muted); margin-top: 6px; max-width: 52ch; }

@media (max-width: 54rem) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; height: auto; padding: 10px 12px; flex-direction: row; align-items: center; gap: 10px; }
  .brand { padding: 0; font-size: 16px; }
  .brand .wordmark, .brand-day, .rail-foot { display: none; }
  .nav { display: flex; overflow-x: auto; scrollbar-width: none; gap: 2px; }
  .nav a { padding: 7px 10px; white-space: nowrap; font-size: 14px; }
  .nav .count { display: none; }
  .main { padding-top: 22px; }
}

/* Primitives */
.card { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); padding: 20px; display: grid; gap: 14px; align-content: start; min-width: 0; }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.card-head h2 { font-size: 17px; font-weight: 700; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--rule); background: var(--surface); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px; white-space: nowrap; transition: transform 0.12s, background 0.15s, border-color 0.15s; text-decoration: none; }
.btn:hover { border-color: var(--ink); }
.btn:active { transform: scale(0.97); }
.btn.primary { background: var(--flag); color: var(--flag-ink); border-color: var(--flag); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.dark { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn.small { padding: 5px 10px; font-size: 13px; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); border-color: var(--rule); }
.btn.ok { background: var(--done-soft); border-color: var(--done); color: var(--done); }
.icon-btn { border: 0; background: transparent; color: var(--muted); cursor: pointer; padding: 4px 6px; border-radius: 6px; font-size: 16px; line-height: 1; }
.icon-btn:hover { color: var(--flag); background: var(--flag-soft); }
.chip { display: inline-flex; align-items: center; gap: 4px; font-family: var(--font-mono); font-size: 11px; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--rule); color: var(--muted); background: var(--surface); white-space: nowrap; }
.chip.ex { border-style: dashed; }
.chip.flag { background: var(--flag-soft); color: var(--flag); border-color: transparent; }
.chip.ok { background: var(--done-soft); color: var(--done); border-color: transparent; }
button.chip { cursor: pointer; }
button.chip:hover { border-color: var(--ink); color: var(--ink); }
.field { display: grid; gap: 5px; min-width: 0; }
.field > span { font-size: 13px; font-weight: 600; }
.field small { color: var(--muted); font-size: 12px; }
.input { width: 100%; border: 1px solid var(--rule); background: var(--paper); border-radius: 8px; padding: 9px 11px; font-size: 14px; transition: border-color 0.15s, background 0.15s; }
.input:focus { outline: none; border-color: var(--ink); background: var(--surface); }
textarea.input { resize: vertical; min-height: 64px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.grid-2 { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); }
.empty { color: var(--muted); font-size: 14px; padding: 18px; border: 1px dashed var(--rule); border-radius: 10px; text-align: center; }
.meter { height: 6px; border-radius: 3px; background: var(--brick-open); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--ink); border-radius: 3px; transition: width 0.5s cubic-bezier(.2,.8,.2,1); }
.meter.flag i { background: var(--flag); }
.meter.ok i { background: var(--done); }
.ex-note { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; padding: 10px 14px; border-radius: 10px; border: 1px dashed var(--rule); font-size: 13px; color: var(--muted); background: var(--surface); }

/* Today */
.today-grid { display: grid; gap: 16px; grid-template-columns: repeat(12, minmax(0, 1fr)); }
.today-grid > * { grid-column: span 12; }
@media (min-width: 64rem) {
  .span-8 { grid-column: span 8 !important; }
  .span-4 { grid-column: span 4 !important; }
  .span-6 { grid-column: span 6 !important; }
}
.hello { display: grid; gap: 4px; }
.hello .big { font-family: var(--font-display); font-weight: 900; font-stretch: 125%; font-size: clamp(40px, 7vw, 68px); line-height: 0.95; letter-spacing: -0.025em; }
.hello .big em { font-style: normal; color: var(--flag); }

.wall-card { gap: 18px; }
.wall { display: grid; gap: 4px; }
.course { display: grid; grid-template-columns: repeat(15, minmax(0, 1fr)); gap: 4px; }
.wall { overflow: hidden; padding: 4px 0; }
.course.offset { margin-left: calc((100% - 56px) / 30 + 2px); margin-right: calc(-1 * ((100% - 56px) / 30 + 2px)); }
.brick { position: relative; height: 26px; border-radius: 3px; border: 0; padding: 0; cursor: pointer; background: var(--brick-open); transition: transform 0.15s, box-shadow 0.15s; }
.brick:hover { transform: translateY(-2px); box-shadow: 0 3px 0 0 var(--rule); }
.brick.p1.laid { background: var(--phase-1); }
.brick.p2.laid { background: var(--phase-2); }
.brick.p3.laid { background: var(--phase-3); }
.brick.p4.laid { background: var(--phase-4); }
.brick.past:not(.laid) { background: repeating-linear-gradient(135deg, var(--brick-open) 0 4px, transparent 4px 8px); box-shadow: inset 0 0 0 1px var(--rule); }
.brick.today, .brick.today.laid { background: var(--flag); box-shadow: 0 0 0 3px var(--flag-soft); animation: pulse 2.4s ease-in-out infinite; }
.brick.today.laid::before { content: "✓"; position: absolute; inset: 0; display: grid; place-items: center; color: var(--flag-ink); font-size: 13px; font-weight: 700; }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px var(--flag-soft); } }
.brick.gate::after { content: ""; position: absolute; top: 50%; right: -6px; width: 8px; height: 8px; background: var(--ink); transform: translateY(-50%) rotate(45deg); z-index: 1; }
.brick.sel { outline: 2px solid var(--ink); outline-offset: 1px; }
.wall-legend { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 12px; color: var(--muted); align-items: center; }
.wall-legend i { display: inline-block; width: 14px; height: 10px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
.phases { display: grid; grid-template-columns: 14fr 16fr 30fr 30fr; gap: 4px; }
.phases div { border-top: 3px solid; padding-top: 6px; font-size: 12px; min-width: 0; }
.phases div b { display: block; font-family: var(--font-display); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.phases div span { color: var(--muted); font-family: var(--font-mono); font-size: 11px; }
.phases div:nth-child(1) { border-color: var(--phase-1); }
.phases div:nth-child(2) { border-color: var(--phase-2); }
.phases div:nth-child(3) { border-color: var(--phase-3); }
.phases div:nth-child(4) { border-color: var(--phase-4); }
.phases div.now b { color: var(--flag); }
.brick-info { min-height: 22px; font-size: 13px; color: var(--muted); }
.brick-info b { color: var(--ink); }

.ritual { display: grid; gap: 8px; }
.ritual button { display: grid; grid-template-columns: 28px 1fr auto; gap: 12px; align-items: center; text-align: left; padding: 12px; border-radius: 10px; border: 1px solid var(--rule); background: var(--paper); cursor: pointer; transition: background 0.15s, border-color 0.15s; }
.ritual button:hover { border-color: var(--ink); }
.ritual .tick { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--rule); display: grid; place-items: center; color: transparent; transition: all 0.2s; }
.ritual button[aria-pressed="true"] { background: var(--done-soft); border-color: var(--done); }
.ritual button[aria-pressed="true"] .tick { background: var(--done); border-color: var(--done); color: var(--surface); }
.ritual b { display: block; font-weight: 600; }
.ritual small { color: var(--muted); }
.ritual .mins { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.check-card .big-num { font-family: var(--font-display); font-weight: 900; font-stretch: 125%; font-size: 56px; line-height: 1; }
.check-card .big-num span { font-size: 16px; font-weight: 500; font-stretch: 100%; color: var(--muted); }
.focus-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.focus-list li { display: flex; gap: 10px; align-items: center; font-size: 14px; }
.focus-list li::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--flag); flex: none; }
.quick { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.quick .btn { justify-content: flex-start; padding: 12px; }

/* Tasks */
.size-pick { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr)); }
.size-pick label { position: relative; display: grid; gap: 2px; padding: 12px 14px; border: 1px solid var(--rule); border-radius: 10px; cursor: pointer; background: var(--paper); transition: border-color 0.15s, background 0.15s; }
.size-pick input { position: absolute; opacity: 0; pointer-events: none; }
.size-pick label:has(input:checked) { border-color: var(--flag); background: var(--flag-soft); }
.size-pick label:has(input:focus-visible) { outline: 2px solid var(--flag); outline-offset: 2px; }
.size-pick b { font-size: 14px; }
.size-pick small { color: var(--muted); font-size: 12px; }
.task-list { display: grid; gap: 10px; }
.task { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px 16px; align-items: center; padding: 16px 18px; background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); text-decoration: none; transition: border-color 0.15s, transform 0.15s; }
.task:hover { border-color: var(--ink); transform: translateX(2px); }
.task h3 { font-family: var(--font-body); font-weight: 600; font-size: 16px; }
.task .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.dots { display: flex; gap: 4px; }
.dots i { width: 22px; height: 6px; border-radius: 3px; background: var(--brick-open); }
.dots i.on { background: var(--ink); }
.dots i.cur { background: var(--flag); }
.dots i.na { opacity: 0.3; background: transparent; box-shadow: inset 0 0 0 1px var(--rule); }

/* Wizard */
.wizard { display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 60rem) { .wizard { grid-template-columns: 15rem minmax(0, 1fr); align-items: start; } }
.stepper { list-style: none; margin: 0; padding: 0; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
@media (min-width: 60rem) { .stepper { flex-direction: column; position: sticky; top: 24px; } }
.stepper button { width: 100%; display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: center; text-align: left; padding: 9px 10px; border: 1px solid transparent; border-radius: 10px; background: transparent; cursor: pointer; white-space: nowrap; color: var(--muted); transition: background 0.15s; }
.stepper button:hover { background: var(--surface); }
.stepper .num { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 14px; background: var(--brick-open); color: var(--muted); }
.stepper button.done .num { background: var(--ink); color: var(--paper); }
.stepper button[aria-current="step"] { background: var(--surface); border-color: var(--rule); color: var(--ink); font-weight: 600; }
.stepper button[aria-current="step"] .num { background: var(--flag); color: var(--flag-ink); }
.stepper button.na { opacity: 0.35; text-decoration: line-through; }
.step-panel { gap: 18px; }
.step-panel .step-title { display: flex; gap: 14px; align-items: start; }
.step-panel .step-title .n { font-family: var(--font-display); font-weight: 900; font-stretch: 125%; font-size: 52px; line-height: 0.85; color: var(--flag); }
.step-panel h2 { font-size: 26px; font-weight: 800; font-stretch: 110%; }
.step-panel .hint { color: var(--muted); margin-top: 4px; }
.tip { display: flex; gap: 10px; padding: 12px 14px; border-radius: 10px; background: var(--paper); font-size: 14px; }
.tip b { color: var(--flag); font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; padding-top: 2px; white-space: nowrap; }
.brief-doc { border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; }
.brief-doc div { display: grid; grid-template-columns: 11rem minmax(0, 1fr); gap: 12px; padding: 9px 14px; border-bottom: 1px solid var(--rule); font-size: 14px; }
.brief-doc div:last-child { border-bottom: 0; }
.brief-doc dt { color: var(--muted); font-size: 12px; font-weight: 600; padding-top: 2px; }
.brief-doc dd { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.brief-doc dd.blank { color: var(--flag); font-family: var(--font-mono); font-size: 12px; }
@media (max-width: 36rem) { .brief-doc div { grid-template-columns: 1fr; gap: 2px; } }
.step-nav { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; border-top: 1px solid var(--rule); padding-top: 16px; }

/* Glossary */
.terms-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(14rem, 1fr)); }
.term { perspective: 900px; height: 150px; border: 0; padding: 0; background: transparent; cursor: pointer; text-align: left; position: relative; }
.term .face { position: absolute; inset: 0; border-radius: var(--r); border: 1px solid var(--rule); background: var(--surface); padding: 16px; display: grid; align-content: space-between; gap: 8px; backface-visibility: hidden; transition: transform 0.5s cubic-bezier(.2,.8,.2,1); overflow: hidden; }
.term .back { transform: rotateY(180deg); background: var(--ink); color: var(--paper); border-color: var(--ink); align-content: start; }
.term.flipped .front { transform: rotateY(-180deg); }
.term.flipped .back { transform: rotateY(0); }
.term .front b { font-family: var(--font-display); font-weight: 800; font-stretch: 112%; font-size: 21px; line-height: 1.1; }
.term .back p { font-size: 14px; overflow-y: auto; }
.term .back .label { color: color-mix(in srgb, var(--paper) 60%, transparent); }
.term .meaning-missing { color: var(--flag); font-family: var(--font-mono); font-size: 11px; }

/* People */
.rings { display: grid; gap: 22px; }
.ring-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.ring-head h2 { font-size: 18px; }
.people-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); }
.person { gap: 10px; }
.person-top { display: flex; gap: 12px; align-items: center; }
.avatar { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-stretch: 112%; background: var(--phase-1); color: var(--ink); flex: none; }
.person h3 { font-family: var(--font-body); font-size: 15px; font-weight: 600; }
.person .role { color: var(--muted); font-size: 13px; }
.person dl { margin: 0; display: grid; gap: 6px; font-size: 13px; }
.person dt { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.person dd { margin: 0; }

.qa .field > span { font-size: 15px; }
.qa .field > span em { font-style: normal; color: var(--flag); font-family: var(--font-mono); font-size: 12px; margin-right: 6px; }
.past { display: grid; gap: 10px; }
.past details { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 12px 16px; }
.past summary { cursor: pointer; font-weight: 600; }
.past dl { margin: 10px 0 0; display: grid; gap: 8px; font-size: 14px; }
.past dt { font-family: var(--font-mono); font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.past dd { margin: 0; white-space: pre-wrap; }
.qgroup { display: grid; gap: 8px; }

.q input { width: 18px; height: 18px; accent-color: var(--done); margin: 0; }
.q.asked span { color: var(--muted); text-decoration: line-through; }

/* Prompts */
.prompt-layout { display: grid; gap: 16px; }
@media (min-width: 60rem) { .prompt-layout { grid-template-columns: 16rem minmax(0, 1fr); align-items: start; } }
.prompt-tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
@media (min-width: 60rem) { .prompt-tabs { flex-direction: column; } }
.prompt-tabs button { display: flex; justify-content: space-between; gap: 12px; align-items: center; text-align: left; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--rule); background: var(--surface); cursor: pointer; font-weight: 600; font-size: 14px; white-space: nowrap; color: var(--muted); }
.prompt-tabs button span { font-family: var(--font-mono); font-size: 11px; font-weight: 400; }
.prompt-tabs button[aria-selected="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }

.prompt-out mark { background: var(--flag-soft); color: var(--flag); border-radius: 3px; padding: 0 3px; }
.prompt-out .filled { background: var(--done-soft); color: var(--done); border-radius: 3px; padding: 0 3px; }

/* Progress */
.goal-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); }
.goal { gap: 10px; }
.goal .num { font-family: var(--font-display); font-weight: 900; font-stretch: 118%; font-size: 36px; line-height: 1; font-variant-numeric: tabular-nums; }
.goal .num.word { font-size: 26px; padding-block: 5px; overflow-wrap: anywhere; }
.goal .num span { font-size: 15px; font-weight: 500; font-stretch: 100%; color: var(--muted); }
.goal p { font-size: 14px; }
.goal .by { font-family: var(--font-mono); font-size: 11px; color: var(--flag); }
.tiers { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr)); }
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.checks label { display: grid; grid-template-columns: 20px 1fr; gap: 10px; cursor: pointer; font-size: 14px; line-height: 1.4; }
.checks input { width: 18px; height: 18px; margin: 1px 0 0; accent-color: var(--flag); }
.checks input:checked + span { color: var(--muted); text-decoration: line-through; }

.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 10px; font-size: 14px; font-weight: 500; z-index: 50; box-shadow: 0 10px 30px rgba(0,0,0,0.18); animation: toast 0.3s cubic-bezier(.2,.8,.2,1); max-width: calc(100vw - 32px); }

        '</div>' +

        '<div class="card wall-card span-8"><div class="card-head"><h2>Your foundation</h2><span class="mono" style="color:var(--muted)">' + laidCount + ' / 90 laid</span></div>' +

          '<div class="phases">' + PHASES.map(function (p, i) { return '<div class="' + (i === ph && d >= 1 && d <= 90 ? "now" : "") + '"><b>' + esc(p.name) + '</b><span>' + p.from + "–" + p.to + "</span></div>"; }).join("") + '</div>' +
          '<div class="brick-info" id="brick-info">' + brickInfo(selBrick) + '</div>' +

        '</div>' +

  V.tasks = function () {

      '<div class="size-pick" role="radiogroup" aria-label="Task size">' + Object.keys(SIZES).map(function (k, i) {
        return '<label><input type="radio" name="size" value="' + k + '"' + (k === "week" ? " checked" : "") + '><b>' + SIZES[k].label + "</b><small>" + SIZES[k].hint + "</small></label>";

  V.task = function (id) {

    if (s === 7) body = fld("outcome", "Two lines: what changed, what's open", "Send this with the result", true) + '<div class="row"><button class="btn primary" type="button" data-act="close-task">' + (t.status === "done" ? "Log another win from this" : "Close task and log the win") + "</button>" + (t.status === "done" ? '<span class="chip ok">Done</span>' : "") + "</div>" + '<p class="mono" style="color:var(--muted)">Then add new terms to the Glossary and new names to People.</p>';

    var si = steps.indexOf(s), prev = steps[si - 1], nxt = steps[si + 1];
    return '<div class="view"><div class="view-head"><div><a href="#tasks" class="mono" style="color:var(--muted);text-decoration:none">← Tasks</a><h1 style="margin-top:6px;font-size:clamp(24px,3.5vw,34px)">' + esc(t.title) + '</h1><div class="row" style="margin-top:10px"><span class="chip">' + SIZES[t.size].label + "</span>" + exChip(t) + '</div></div><button class="btn ghost small" data-act="del-task">Delete task</button></div>' +
      '<div class="wizard"><ol class="stepper">' + [1, 2, 3, 4, 5, 6, 7].map(function (i) {
        var na = steps.indexOf(i) < 0;
        return '<li><button type="button" data-act="goto" data-s="' + i + '" class="' + (na ? "na" : (t.status === "done" || i < t.step) ? "done" : "") + '"' + (i === s ? ' aria-current="step"' : "") + (na ? " disabled" : "") + '><span class="num">' + i + "</span>" + STEPS[i].t + "</button></li>";
      }).join("") + "</ol>" +
      '<div class="card step-panel"><div class="step-title"><span class="n">' + s + "</span><div><h2>" + st.t + '</h2><p class="hint">' + st.h + "</p></div></div>" +

      '<div class="step-nav">' + (prev ? '<button class="btn" data-act="goto" data-s="' + prev + '">← ' + STEPS[prev].t + "</button>" : "<span></span>") +
      (nxt ? '<button class="btn dark" data-act="advance" data-s="' + nxt + '">Next: ' + STEPS[nxt].t + " →</button>" : "") + "</div></div></div></div>";

  V.friday = function () {

        '<label class="field"><span><em>02</em>Where did I have an opinion and not say it?</span><textarea class="input" id="r-held" name="held">' + esc(r.held) + "</textarea><small>After four weeks, look for the pattern: which meetings, people, topics. Then pick one to speak up in.</small></label>" +
        '<label class="field"><span><em>03</em>Who should I meet next week, and what do I want to learn?</span><textarea class="input" id="r-next" name="next">' + esc(r.next) + "</textarea></label>" +
        '<div class="row"><button class="btn primary" type="submit">' + (r.saved ? "Update this week" : "Save this week") + "</button>" + (r.saved ? '<span class="chip ok">Saved</span>' : "") + "</div></form>" +
      (past.length ? '<span class="label">Past weeks</span><div class="past">' + past.map(function (k) { var p = S.reviews[k]; return "<details><summary>" + k.replace("-W", " · week ") + "</summary><dl><dt>Moved</dt><dd>" + esc(p.moved || "—") + "</dd><dt>Held back</dt><dd>" + esc(p.held || "—") + "</dd><dt>Next</dt><dd>" + esc(p.next || "—") + "</dd></dl></details>"; }).join("") + "</div>" : "") + "</div>";
  };

  V.prompts = function () {
    var cur = PROMPTS.filter(function (p) { return p.id === V.prompts.sel; })[0] || PROMPTS[0];
    var vals = (V.prompts.vals = V.prompts.vals || {});
    var slots = (cur.q.match(/\[[^\]]+\]/g) || []);
    return '<div class="view"><div class="view-head"><div><h1>Prompts</h1><p>Fill the blanks, copy, run in Copilot Chat. Treat every answer as a draft.</p></div></div>' +
      '<div class="prompt-layout"><div class="prompt-tabs" role="tablist" aria-label="Prompts">' + PROMPTS.map(function (p) {
        return '<button role="tab" id="pt-' + p.id + '" aria-selected="' + (p === cur) + '" data-act="prompt" data-id="' + p.id + '">' + p.t + "<span>" + p.w + "</span></button>";
      }).join("") + '</div><div class="card" role="tabpanel" aria-labelledby="pt-' + cur.id + '"><div class="card-head"><h2 style="font-size:22px">' + cur.t + '</h2><button class="btn primary" data-act="copy-prompt">Copy prompt</button></div>' +
      (slots.length ? '<div class="grid-2">' + slots.map(function (s) { var k = s.slice(1, -1); return '<label class="field"><span>' + esc(k.charAt(0).toUpperCase() + k.slice(1)) + '</span><input class="input" data-slot="' + esc(k) + '" id="slot-' + esc(k) + '" value="' + esc(vals[k] || "") + '" autocomplete="off"></label>'; }).join("") + "</div>" : "") +
      '<div class="prompt-out" id="prompt-out">' + promptHTML(cur) + "</div></div></div></div>";
  };
  function promptFill(p, html) {
    var vals = V.prompts.vals || {};
    var src = html ? esc(p.q) : p.q;
    return src.replace(/\[([^\]]+)\]/g, function (m, k) { var v = vals[k]; return v ? (html ? '<span class="filled">' + esc(v) + "</span>" : v) : (html ? "<mark>" + m + "</mark>" : m); });
  }
  function promptHTML(p) { return promptFill(p, true); }

  function goalCard(n, of, label, by) {
    return '<div class="card goal"><span class="label">' + label + '</span><div class="num">' + n + " <span>/ " + of + '</span></div><div class="meter ' + (n >= of ? "ok" : "flag") + '"><i style="width:' + Math.min(n / of * 100, 100) + '%"></i></div><span class="by">' + by + "</span></div>";
  }
  V.progress = function () {
    var withBrief = S.tasks.filter(function (t) { return t.f.sent; }).length, eligible = S.tasks.filter(function (t) { return t.size !== "small"; }).length;
    var reviews = Object.keys(S.reviews).filter(function (k) { return S.reviews[k].saved; }).length;
    var met = S.people.filter(function (p) { return p.met > 0; }).length, oneOnes = S.people.reduce(function (a, p) { return a + (p.met || 0); }, 0);
    var decoded = S.terms.filter(function (t) { return t.meaning; }).length;
    var weeks = Math.max(1, Math.ceil(Math.max(dayNum(), 1) / 7));
    return '<div class="view"><div class="view-head"><div><h1>Progress</h1><p>Leading numbers say the system is running. If they slip two weeks running, cut steps before adding discipline.</p></div></div>' +
      '<div class="goal-grid">' +
        '<div class="card goal"><span class="label">Briefs sent</span><div class="num">' + (eligible ? Math.round(withBrief / eligible * 100) : 0) + '<span>%</span></div><div class="meter flag"><i style="width:' + (eligible ? withBrief / eligible * 100 : 0) + '%"></i></div><p>' + withBrief + " of " + eligible + ' tasks over half a day</p><span class="by">60% by day 30 · 90% by day 90</span></div>' +
        goalCard(reviews, Math.min(weeks, 13), "Friday reviews done", "Every week") +
        goalCard(oneOnes, 12, "1:1s held", "5 by day 30 · 12 by day 90") +
        goalCard(met, 8, "people met 1:1", "8 by day 75") +
        '<div class="card goal"><span class="label">Glossary</span><div class="num">' + decoded + " <span>/ " + S.terms.length + ' decoded</span></div><div class="meter"><i style="width:' + (S.terms.length ? decoded / S.terms.length * 100 : 0) + '%"></i></div><span class="by">≤ 1 unknown term per meeting by day 45</span></div>' +
        '<div class="card goal"><span class="label">Wins logged</span><div class="num">' + S.wins.length + '</div><p>At least one a week, or a note on why not.</p><span class="by">Connects-ready</span></div>' +
      "</div>" +
      '<div class="tiers">' + TIERS.map(function (tier) {
        var done = tier.items.filter(function (_, i) { return S.checks[tier.id + i]; }).length;
        return '<div class="card"><div class="card-head"><h2>' + tier.t + '</h2><span class="mono" style="color:var(--muted)">' + done + " / " + tier.items.length + '</span></div><div class="meter flag"><i style="width:' + done / tier.items.length * 100 + '%"></i></div><ul class="checks">' + tier.items.map(function (it, i) {
          return '<li><label><input type="checkbox" id="chk-' + tier.id + i + '" data-act="chk" data-k="' + tier.id + i + '"' + (S.checks[tier.id + i] ? " checked" : "") + "><span>" + esc(it) + "</span></label></li>";
        }).join("") + "</ul>" + (tier.id === "p2" ? '<p class="mono" style="color:var(--muted)">Automate only what you\'ve done by hand for a month and still skip.</p>' : "") + "</div>";
      }).join("") + "</div></div>";
  };

  /* ---------- Router ---------- */
  var main = document.getElementById("main");
  function route() { var h = (location.hash || "#today").slice(1); return h; }
  function render(keepScroll) {
    var h = route(), name = h.indexOf("task-") === 0 ? "task" : (V[h] ? h : "today");
    renderShell(name);
    if (keepScroll) main.setAttribute("data-still", ""); else main.removeAttribute("data-still");
    main.innerHTML = name === "task" ? V.task(h.slice(5)) : V[name]();
    if (!keepScroll) window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", function () { selBrick = null; render(); });

  function findTask() { var h = route(); return S.tasks.filter(function (t) { return "task-" + t.id === h; })[0]; }
  function byId(list, id) { return list.filter(function (x) { return x.id === id; })[0]; }
  function rerender() { var y = window.scrollY; render(true); window.scrollTo(0, y); }

  /* ---------- Events ---------- */
  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-act]"); if (!el) return;
    var act = el.dataset.act, id = el.dataset.id, t;
    if (act === "clear-ex") { clearExamples(); rerender(); toast("Examples cleared. It's all yours."); }
    if (act === "brick") { selBrick = Number(el.dataset.n); document.querySelectorAll(".brick.sel").forEach(function (b) { b.classList.remove("sel"); }); el.classList.add("sel"); document.getElementById("brick-info").innerHTML = brickInfo(selBrick); }
    if (act === "ritual") {
      var k = el.dataset.k; S.daily[T] = S.daily[T] || {}; S.daily[T][k] = !S.daily[T][k]; save();
      var wasLaid = Object.keys(S.daily[T]).filter(function (x) { return S.daily[T][x]; }).length === 1 && S.daily[T][k];
      rerender();
      if (wasLaid) { burst(document.querySelector(".brick.today")); toast("Brick laid for day " + dayNum() + "."); }
    }
    if (act === "goto" || act === "advance") {
      t = findTask(); if (!t) return;
      var s = Number(el.dataset.s); t.view = s;
      if (act === "advance" && s > t.step) t.step = s;
      save(); render();
    }
    if (act === "toggle") { t = findTask(); t.f[el.dataset.k] = !t.f[el.dataset.k]; save(); rerender(); if (t.f[el.dataset.k]) burst(el); }
    if (act === "copy-brief") { t = findTask(); copyText(briefText(t), el); }
    if (act === "copy-map") { t = findTask(); copyText("Find anything in my email, Teams, SharePoint and Loop about " + t.title + " from the last 12 months: docs, decisions, people involved.", el); }
    if (act === "close-task") {
      t = findTask(); t.status = "done"; t.step = 7;
      S.wins.push({ id: uid(), date: T, what: t.title, part: t.f.outcome || "", link: "" }); save();
      burst(el); toast("Task closed. Win logged."); setTimeout(function () { location.hash = "#wins"; }, 700);
    }
    if (act === "del-task") { t = findTask(); S.tasks = S.tasks.filter(function (x) { return x !== t; }); save(); location.hash = "#tasks"; toast("Task deleted."); }
    if (act === "starter") { var inp = document.getElementById("term-term"); inp.value = el.dataset.t; document.getElementById("term-meaning").focus(); }
    if (act === "del-term") { e.stopPropagation(); S.terms = S.terms.filter(function (x) { return x.id !== id; }); save(); rerender(); return; }
    if (act === "flip") { el.classList.toggle("flipped"); }
    if (act === "star") { var p = byId(S.people, id); p.mentor = !p.mentor; save(); rerender(); }
    if (act === "met") { var pm = byId(S.people, id); pm.met = (pm.met || 0) + 1; pm.last = T; save(); rerender(); burst(document.querySelector('[data-act="met"][data-id="' + id + '"]')); toast("1:1 logged with " + pm.name + "."); }
    if (act === "del-person") { S.people = S.people.filter(function (x) { return x.id !== id; }); save(); rerender(); }
    if (act === "del-q") { e.preventDefault(); S.questions = S.questions.filter(function (x) { return x.id !== id; }); save(); rerender(); }
    if (act === "del-win") { S.wins = S.wins.filter(function (x) { return x.id !== id; }); save(); rerender(); }
    if (act === "copy-wins") {
      var txt = S.wins.slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; }).map(function (w) { return "• " + fmt(w.date) + ": " + w.what + (w.part ? ". My part: " + w.part : "") + (w.link ? " (" + w.link + ")" : ""); }).join("\n");
      copyText(txt, el);
    }
    if (act === "prompt") { V.prompts.sel = id; rerender(); }
    if (act === "copy-prompt") { var cur = PROMPTS.filter(function (p) { return p.id === V.prompts.sel; })[0] || PROMPTS[0]; copyText(promptFill(cur, false), el); }
  });
  document.addEventListener("keydown", function (e) {
    var el = e.target.closest && e.target.closest('[data-act="del-term"]');
    if (el && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); e.stopPropagation(); el.click(); }
  });
  document.addEventListener("change", function (e) {
    var el = e.target;
    if (el.dataset.act === "asked") { var q = byId(S.questions, el.dataset.id); q.asked = el.checked; save(); rerender(); }
    if (el.dataset.act === "chk") { S.checks[el.dataset.k] = el.checked; save(); rerender(); }
  });
  document.addEventListener("input", function (e) {
    var el = e.target;
    if (el.dataset.f) {
      var t = findTask(); t.f[el.dataset.f] = el.value; save();
      var doc = document.getElementById("brief-doc"); if (doc) doc.innerHTML = briefRows(t);
    }
    if (el.dataset.slot !== undefined) {
      V.prompts.vals[el.dataset.slot] = el.value;
      var cur = PROMPTS.filter(function (p) { return p.id === V.prompts.sel; })[0] || PROMPTS[0];
      document.getElementById("prompt-out").innerHTML = promptHTML(cur);
    }
    if (el.id === "term-search") {
      V.glossary.q = el.value; var q = el.value.toLowerCase();
      document.querySelectorAll(".term").forEach(function (c) { c.hidden = !!q && c.dataset.text.indexOf(q) < 0; });
    }
  });
  document.addEventListener("submit", function (e) {
    var f = e.target, kind = f.dataset.form; if (!kind) return;
    e.preventDefault();
    var d = {}; new FormData(f).forEach(function (v, k) { d[k] = String(v).trim(); });
    if (kind === "task") {
      var size = d.size || "week", nt = { id: uid(), title: d.title, size: size, step: 1, created: T, status: "open", f: { ask: "", requester: "", deadline: "", why: "", done: "", scope: "", prior: "", people: "", risks: "", checkin: "", sent: false, draft: false, outcome: "" } };
      S.tasks.unshift(nt); save(); location.hash = "#task-" + nt.id; return;
    }
    if (kind === "term") { S.terms.push({ id: uid(), term: d.term, meaning: d.meaning, where: d.where, date: T }); toast(d.meaning ? "Added to your glossary." : "Added. Decode it on Friday."); }
    if (kind === "person") { S.people.push({ id: uid(), name: d.name, role: d.role, owns: d.owns, cares: d.cares, ring: d.ring || "direct", met: 0, last: "", mentor: false }); toast(d.name + " added."); }
    if (kind === "question") { S.questions.push({ id: uid(), q: d.q, who: d.who || "Anyone", asked: false }); toast("Parked. Ask at the next 1:1."); }
    if (kind === "win") { S.wins.push({ id: uid(), date: T, what: d.what, part: d.part, link: d.link }); burst(f.querySelector("button")); toast("Win logged."); }
    if (kind === "review") { S.reviews[weekKey(T)] = { moved: d.moved, held: d.held, next: d.next, saved: true }; S.daily[T] = S.daily[T] || {}; S.daily[T].friday = true; burst(f.querySelector("button")); toast("Week saved."); }
    save(); rerender();
  });

  render();
})();
</script>
</body>
</html>
